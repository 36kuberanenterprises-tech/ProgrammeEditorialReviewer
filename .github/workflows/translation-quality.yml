name: Translation quality checks

on:
  push:
    branches:
      - feature/hindi-gujarati-translation
      - main
  pull_request:
    branches:
      - main

jobs:
  test-translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile and run tests
        run: |
          python -m compileall -q app.py translation_service.py
          pytest -q tests/test_translation_service.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("templates/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/proofreader-ui.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/proofreader-ui.js
