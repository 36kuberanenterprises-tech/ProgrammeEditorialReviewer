services:
  - type: web
    name: edii-attendance-staff
    runtime: python
    plan: free
    region: singapore
    branch: edii-attendance-live-preview
    buildCommand: pip install -r attendance-app/requirements.txt
    startCommand: cd attendance-app && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edii-attendance-pilot-db
          property: connectionString
